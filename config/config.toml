[audio]
sample_rate = 48000
block_size = 960
Rbuffer_size = 32


[device]
input = ""
output = ""
channelInput = 1
channelOutput = 2

[system]
logging = false
console_logging = true

[pipeline]
stages = [
    "gain",
    "high_pass",
    "low_pass",
    "noisegate",
    "Compressor",
    "radio_effect",
    "formant_shifter",
    "rvc",
    "limiter",
]


[dsp]

[dsp.gain]
gain = 1.0

[dsp.filters]

[dsp.filters.hpf]
cutoff = 65

[dsp.filters.lpf]
cutoff = 16000

[dsp.limiter]
threshold = 0.85
drive = 0.4
mode = "soft"

[dsp.noisegate]
threshold = 0.015
attack = 0.005
release = 0.150

[dsp.normalizer]
threshold_f = 0.7
mode_f = "rms"
threshold_b = 0.7
mode_b = "rms"

[dsp.resampler]
AALP_threshold = 15500
rspl_target = 16000

[dsp.compressor]
threshold = 0.40
ratio = 3.5
attack  = 0.01
release = 0.10



[rvc]
model        = "./models/xiaomu/xiaomu.pth"
index        = "./models/xiaomu/xiaomu.index"
vec          = "./models/vec-768-layer-12.onnx"
rmvpe_onnx   = "./models/rmvpe.onnx"
rmvpe_pt     = "./models/rmvpe.pt"
pitch        = 0
use_onnx     = true
hop_size     = 3840
context_size = 2560