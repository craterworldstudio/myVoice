[audio]
sample_rate = 48000
block_size = 1024
Rbuffer_size = 32


[device]
input = ""
output = ""
channelInput = 1
channelOutput = 2

[system]
console_logging = true

[pipeline]
stages = [
    "normalizerF",
    "high_pass",
    "low_pass",
    "noisegate",
    
    "gain",

    "aalp",
    "limiter",
    "normalizerB",
    "presamplerF",
    "presamplerB"
]
gain = 1.7782794

hpf_cutoff = 120
lpf_cutoff = 60000

limiter_threshold = 0.70794576
limiter_drive = 0.6
limiter_mode = "Soft"

noisegate_threshold = 0.01
noisegate_attack = 0.015
noisegate_release = 0.125

normalizer_threshold_f = 0.7
normalizer_mode_f = "rms"
normalizer_threshold_b = 0.7
normalizer_mode_b = "rms"

AALP_threshold = 15500
rspl_target = 32000


[rvc]
model = "./models/voice1/model.pth"
index = "./models/voice1/model.index"
pitch = 0